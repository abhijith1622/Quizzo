services:
  - type: web
    name: quizzo-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
